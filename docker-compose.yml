services:
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - default
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  mssql:
    image: mssql-custom:latest
    build:
      context: ./mssql
    container_name: mssql_container
    restart: always
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - 1433:1433
    volumes:
      - sql-server-data:/var/opt/mssql
    healthcheck:
      # test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" || exit 1
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  login:
    image: login-service:latest
    container_name: login-service
    restart: always
    build:
      context: ./login-service
    env_file:
      - .env
    ports:
      - ${LOGIN_SERVICE_PORT}:80
    environment:
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}

  user:
    image: user-service:latest
    container_name: user-service
    restart: always
    build:
      context: ./user-service
    ports:
      - ${USER_SERVICE_PORT}:80
    depends_on:
      - mssql
    env_file:
      - .env
    environment:
      - MSSQL_HOST=mssql
      - MSSQL_USER=${MSSQL_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_DB=${MSSQL_DB}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}

  post:
    image: post-service:latest
    container_name: post-service
    restart: always
    build:
      context: ./post-service
    ports:
      - ${POST_SERVICE_PORT}:80
    depends_on:
      - mssql
    env_file:
      - .env
    environment:
      - MSSQL_HOST=mssql
      - MSSQL_USER=${MSSQL_USER}
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_DB=${MSSQL_DB}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}

  bff:
    image: bff-service:latest
    container_name: bff-service
    restart: always
    build:
      context: ./bff-service
    ports:
      - 8000:80
    depends_on:
      - login
      - user
      - post
    env_file:
      - .env
    environment:
      - LOGIN_SERVICE_URL=host.docker.internal
      - LOGIN_SERVICE_PORT=${LOGIN_SERVICE_PORT}
      - USER_SERVICE_URL=host.docker.internal
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - POST_SERVICE_URL=host.docker.internal
      - POST_SERVICE_PORT=${POST_SERVICE_PORT}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}

volumes:
  sql-server-data:
